version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16  # PostgreSQL pre-configured with pgvector extension
    container_name: llm_autopilot_db
    restart: always
    environment:
      POSTGRES_DB: llm_autopilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: llm_autopilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
